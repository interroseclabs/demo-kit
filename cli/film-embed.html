<!doctype html>
<!-- A reference for a website's team: the home page module demo-kit film cuts its videos for, a
     tour that plays itself. Chapter tabs choose a video; the bars under it are its steps, filling
     as it plays, and seek to a step when clicked; the step's words sit beside them. The steps and
     their times are timings.json's, written in here so the page opens from its folder. Plain HTML,
     CSS and JS, to port to the site's own components. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ walkthrough</title>
<style>
  :root { __COLORS__ }
  body { margin: 0; background: color-mix(in srgb, var(--bg) 8%, #f4f6f8); font-family: __FONT__, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .gd-film { max-width: 1240px; margin: 48px auto; padding: 64px 56px 56px; border-radius: 28px; color: var(--fg);
    background: radial-gradient(900px 500px at 15% 0%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 60%),
                radial-gradient(900px 600px at 100% 100%, color-mix(in srgb, color-mix(in srgb, var(--accent) 35%, #2a5cbe) 28%, transparent), transparent 60%), var(--bg); }
  .gd-film h2 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.1; letter-spacing: -.025em; font-weight: 700; }
  .gd-film .lede { margin: 16px 0 0; max-width: 640px; font-size: 18px; line-height: 1.55; color: var(--muted-fg); }
  .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 32px 0 24px; }
  .tab { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--fg) 16%, transparent); background: color-mix(in srgb, var(--fg) 4%, transparent);
    color: var(--fg); font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1; }
  .tab i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .stage { position: relative; aspect-ratio: 2 / 1; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 50px 90px -40px rgb(0 0 0 / .85), 0 0 0 1px color-mix(in srgb, var(--fg) 14%, transparent), 0 0 0 8px color-mix(in srgb, var(--fg) 5%, transparent); }
  .stage video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 22px; }
  .bar { all: unset; cursor: pointer; display: grid; gap: 9px; min-width: 0; }
  .bar .track { height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--fg) 16%, transparent); overflow: hidden; }
  .bar .fill { display: block; height: 100%; width: 0; background: var(--accent); }
  .bar .lbl { font-size: 13px; font-weight: 600; color: color-mix(in srgb, var(--fg) 45%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar[aria-current="step"] .lbl { color: var(--fg); }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .caption { display: flex; justify-content: space-between; gap: 32px; margin-top: 18px; min-height: 76px; }
  .caption h3 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .caption p { margin: 6px 0 0; max-width: 720px; font-size: 15px; line-height: 1.55; color: var(--muted-fg); }
  .ctl { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex: none; }
  .pause { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent); font-size: 14px; font-weight: 600; }
  .pause:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cta { color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }
  @media (max-width: 720px) {
    .gd-film { margin: 0; border-radius: 0; padding: 40px 16px; }
    .bars { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
    .caption { flex-direction: column; }
    .ctl { align-items: flex-start; flex-direction: row; }
  }
</style>
</head>
<body>
<section class="gd-film" aria-label="__TITLE__ walkthrough">
  <h2>__HEADING__</h2>
  <p class="lede">__LEDE__</p>
  <div class="tabs" role="tablist"></div>
  <div class="stage"><video muted playsinline preload="metadata"></video></div>
  <div class="bars"></div>
  <div class="caption">
    <div><h3></h3><p></p></div>
    <div class="ctl"><button class="pause" type="button">Pause</button>__CTA__</div>
  </div>
</section>
<script>
const TIMINGS = __TIMINGS__;
const TABS = __TABS__; // [{ id, title, video }], one a chapter, in order
const root = document.querySelector(".gd-film");
const video = root.querySelector("video");
const tabs = root.querySelector(".tabs"), bars = root.querySelector(".bars");
const title = root.querySelector(".caption h3"), body = root.querySelector(".caption p"), pause = root.querySelector(".pause");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let at = 0, steps = [], playing = !still;

TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
  b.append(document.createElement("i"), t.title);
  b.onclick = () => open(i, true);
  tabs.append(b);
});

function open(i, play) {
  at = i;
  const t = TABS[i];
  [...tabs.children].forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
  steps = TIMINGS.videos[t.video].steps;
  bars.replaceChildren(...steps.map((st) => {
    const b = document.createElement("button");
    b.className = "bar"; b.type = "button";
    b.innerHTML = `<span class="track"><span class="fill"></span></span><span class="lbl"></span>`;
    b.querySelector(".lbl").textContent = st.label;
    b.onclick = () => { video.currentTime = st.start + 0.05; go(true); };
    return b;
  }));
  video.poster = `${t.video}-poster.jpg`;
  video.innerHTML = `<source src="${t.video}-1920x960.mp4" type="video/mp4"><source src="${t.video}-1920x960.webm" type="video/webm">`;
  video.load();
  if (play ?? playing) go(true);
}

function go(on) {
  playing = on;
  pause.textContent = on ? "Pause" : "Play";
  on ? video.play().catch(() => go(false)) : video.pause();
}
pause.onclick = () => go(!playing);
video.onended = () => open((at + 1) % TABS.length, true);

// Each frame: the step the video is in, its bar filling, the bars before it full.
(function tick() {
  const t = video.currentTime, D = TIMINGS.videos[TABS[at].video].duration;
  let k = 0;
  steps.forEach((s, i) => { if (t >= s.start) k = i; });
  [...bars.children].forEach((b, i) => {
    const end = steps[i + 1]?.start ?? D;
    const f = i < k ? 1 : i > k ? 0 : Math.min(1, Math.max(0, (t - steps[i].start) / (end - steps[i].start)));
    b.querySelector(".fill").style.width = f * 100 + "%";
    if (i === k) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  if (steps[k] && title.textContent !== steps[k].title) { title.textContent = steps[k].title; body.textContent = steps[k].body; }
  requestAnimationFrame(tick);
})();

// Play only while the module is on screen.
new IntersectionObserver(([e]) => { if (!e.isIntersecting) video.pause(); else if (playing) video.play().catch(() => {}); }, { threshold: 0.35 }).observe(video);
open(0, !still);
</script>
</body>
</html>
